
environment: prod

replicaCount: 2
appName: rasa
appsettings_enabled: false  

secrets:
  enabled: false
  refs:
    - sepas-get-net

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/health/cmds/rasa/sepas-get-net
  pullPolicy: IfNotPresent
  tag:  v2.0.9-prod

imagePullSecrets: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080

service2:
  enabled: false
  type: ClusterIP
  ports: []

storage:

  hostPath:
    enabled: false
    path: /home/matin/logs-tep-app
    mountPath: /app/logs
    type: DirectoryOrCreate   # optional

  nfs:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/logs-ap/ap-prod/cmds/rasa/sepas-get-net"
    mountPath: /app/logs

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/logs-ap/ap-prod/paraclinic-webapi"
    mountPath: "/app/logs"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/logs-ap/ap-prod/paraclinic-webapi"
    mountPath: "/app/logs"

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  nfs_shell_log:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/logs-ap/ap-prod/cmds/rasa/sepas-get-net/shelllog"

  nfs_apm:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/elastic-apm"
    mountPath: /opt/apm-agent    

configmap:
  
  HISTFILE: "/audit/commands.log"
  HISTTIMEFORMAT: "%F %T "
  PROMPT_COMMAND: "history 1 >> /audit/commands.log"
  Logging__dir: "/app/logs"
  TZ: "Asia/Tehran"

  JwtSettings__SecretKey: "this_is_a_very_secure_and_long_key_123456"
  JwtSettings__Issuer: "YourApp"
  JwtSettings__Audience: "YourAppUsers"
  JwtSettings__ExpiryInMinutes: "60"

  AppSetting__SendDataUrl: "http://172.16.5.10:81/api/Sata/RegisterSepasDoc"
  AppSetting__SendDataUrlRasaToken: "https://rsa.tamin.ir:6060/api/v1/Authorize/GetToken"
  AppSetting__SendDataUrlRasa: "https://rsa.tamin.ir:6060/api/v1/Asnad/GetXmlDocument"
  AppSetting__SendDataTimeout: "30"
  AppSetting__LogFilePath: "/app/logs"
  AppSetting__LogErrorEnable: "true"
  AppSetting__WorkerCount: "10"
  AppSetting__FileBatchSize: "20"

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "rasa.tamin.ir"
  rules:
    - port: 8080          
      matches:
        - path:
            type: PathPrefix
            value: /

httpRoute2:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "rasa2.tamin.ir"
  rules:
    - port: 8081        
      matches:
        - path:
            type: PathPrefix
            value: /admin

# -----------------------------------------------
# Rate limit for primary service
# -----------------------------------------------
rateLimitPolicy:
  enabled: true
  rules:
    - requests: 1000
      unit: Minute
 
# -----------------------------------------------
# Rate limit for secondary service (if service2 enabled)
# -----------------------------------------------
rateLimitPolicy2:
  enabled: false           # set true to activate
  rules:
    # Rule 1 — global limit, applies to all requests
    - requests: 100        # number of requests allowed
      unit: Second         # Second / Minute / Hour
 
    # Rule 2 — stricter limit for a specific header value
    # useful for per-tenant or per-api-key limiting
    - requests: 10
      unit: Second
      headers:
        - name: x-api-key
          value: "free-tier"

resources:
  limits:
    cpu: 4000m
    memory: 35Gi
  requests:
    cpu: 250m
    memory: 8Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}