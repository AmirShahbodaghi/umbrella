        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        },
        "dir": "/app/logs"
      },
      "ThirdParties": {
        "AccessMng": {
          "RequestUrl": "https://access.tamin.ir/api/access-management/request/custom",
          "Timeout": "00:00:03"
        }
      },
      "AllowedHosts": "*",
      "Kestrel": {
        "Endpoints": {
          "Grpc": {
            "Url": "http://0.0.0.0:8080",
            "Protocols": "Http2"
          }
        }
      },
      "Redis": {
        "SentinelHosts": [
