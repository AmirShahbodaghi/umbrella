environment: prod

replicaCount: 0
appName: darman-access-net-prod
 
secrets:
  enabled: true
  refs:
    - darman-access-net-prod

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/health/darman-access-net
  pullPolicy: IfNotPresent
  tag: v2.0.3-prod


imagePullSecrets: []
  # - name: registry-secret

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080

service2:
  enabled: false
  type: ClusterIP
  ports: []

# Storage configuration
storage:
  hostPath:
    enabled: false
    path: /***
    mountPath: /***
    type: DirectoryOrCreate   # optional
  # Enable NFS storage
  nfs:
    enabled: true
    server: "172.16.5.139"
    path: "ap-prod/darman-access-net"
    mountPath: /app/logs

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"
  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  
  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi
  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "ap-prod/darman-access-net/shelllog"
  nfs_apm:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/elastic-apm"
    mountPath: /opt/apm-agent    



# Environment variables
configmap:


httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "darman-access-net-prod.tamin.ir"
  rules:
    - port: 8080         
      matches:
        - path:
            type: PathPrefix
            value: /api

httpRoute2:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "***"
  rules:
    - port: 8081        
      matches:
        - path:
            type: PathPrefix
            value: /admin

rateLimitPolicy:
  enabled: false
  rules:
    - requests: 10
      unit: Minute

rateLimitPolicy2:
  enabled: false          
  rules:
    - requests: 100       
      unit: Second         
    - requests: 10
      unit: Second
      headers:
        - name: x-api-key
          value: "free-tier"

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80



nodeSelector: {}

tolerations: []

affinity: {}

appsettings_enabled: true

