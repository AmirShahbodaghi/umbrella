
environment: prod

replicaCount: 1
appName: payeshnotify


secrets:
  enabled: true
  refs:
    - payeshnotify

image:
  registry: pull-devops.tamin.ir
  repository: devops/payeshnotify
  pullPolicy: IfNotPresent
  tag: v1.0.9-dev

imagePullSecrets: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080

service2:
  enabled: false
  type: ClusterIP
  ports: []

storage:

  hostPath:
    enabled: false
    path: /home/matin/logs-tep-app
    mountPath: /app/logs
    type: DirectoryOrCreate   # optional

  nfs:
    enabled: true
    server: "172.16.5.139"
    path: "general/payeshnotify"
    mountPath: /app/log

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: ""
    mountPath: "/app/logs"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  
  
  fourth_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"   

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "general/payeshnotify/shelllog"

  nfs_apm:
    enabled: false
    server: "172.16.5.139"
    path: "/data/k8s-nfs/elastic-apm"
    mountPath: /opt/apm-agent  

configmap:
  TZ: Asia/Tehran


httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "payeshnotify.tamin.ir"
  rules:
    - port: 8080          
      matches:
        - path:
            type: PathPrefix
            value: /

httpRoute2:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "rasa2.tamin.ir"
  rules:
    - port: 8081        
      matches:
        - path:
            type: PathPrefix
            value: /admin

# -----------------------------------------------
# Rate limit for primary service
# -----------------------------------------------
rateLimitPolicy:
  enabled: true           # set true to activate
  rules:
    # Rule 1 — global limit, applies to all requests
    - requests: 10        # number of requests allowed
      unit: Minute         # Second / Minute / Hour
 
    # Rule 2 — stricter limit for a specific header value
    # useful for per-tenant or per-api-key limiting
    - requests: 10
      unit: Second
      headers:
        - name: x-api-key
          value: "free-tier"
 
# -----------------------------------------------
# Rate limit for secondary service (if service2 enabled)
# -----------------------------------------------
rateLimitPolicy2:
  enabled: false           # set true to activate
  rules:
    # Rule 1 — global limit, applies to all requests
    - requests: 100        # number of requests allowed
      unit: Second         # Second / Minute / Hour
 
    # Rule 2 — stricter limit for a specific header value
    # useful for per-tenant or per-api-key limiting
    - requests: 10
      unit: Second
      headers:
        - name: x-api-key
          value: "free-tier"

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 250m
    memory: .5Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}



appsettings_enabled: true    # ← change this from false to true

appsettings: |               # ← add this block at top level (not inside configmap)
  {
  "TrustedIPs": [ "172.16.5.5", "172.16.15.172", "172.16.14.11", "172.16.14.68", "172.16.14.80", "::1", "172.16.14.118", "127.0.0.1", "localhost", "::ffff:172.16.5.5", "::ffff:172.16.15.172", "::ffff:172.16.1.40", "::ffff:127.0.0.1", "::ffff:172.16.14.11", "::ffff:172.16.14.68", "::ffff:172.16.14.80", "::ffff:172.16.14.118", "::ffff:127.0.0.1", "::ffff:10.234.102.204", "::ffff:localhost" ],

  "smsCenter": {
    "username": "",
    "password": "",
    "from": "2000256"
  },
  "Logging": {
    "LogLevel": {
      "Default": "Information",
      "Microsoft.AspNetCore": "Warning"
      }
   }
  }
  