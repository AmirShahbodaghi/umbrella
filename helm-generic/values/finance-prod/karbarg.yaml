environment: prod

replicaCount: 1
appName: karbarg-front-prod
appsettings_enabled: false  

secrets:
  enabled: false
  refs:
    - takhsis-front-prod

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/finance/karbarg/karbarg-front
  pullPolicy: IfNotPresent
  tag: v1.1.8-prod

serviceAccount:
  create: false
  annotations: {}
  name: ""

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 80

service2:
  enabled: false
  type: ClusterIP
  ports: []

storage:
  hostPath:
    enabled: false
    path: /***
    mountPath: /***
    type: DirectoryOrCreate   # optional

  nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  
  
  fourth_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"   

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/karbarg/front/shelllog"

  nfs_apm:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"   

configmap:
  TZ: Asia/Tehran

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "karbarg.tamin.ir"
  rules:
    - port: 8080         
      matches:
        - path:
            type: PathPrefix
            value: /

httpRoute2:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - "***"
  rules:
    - port: 8080        
      matches:
        - path:
            type: PathPrefix
            value: /admin

rateLimitPolicy:
  enabled: false
  rules:
    - requests: 10
      unit: Minute

rateLimitPolicy2:
  enabled: false          
  rules:
    - requests: 100       
      unit: Second         
    - requests: 10
      unit: Second
      headers:
        - name: x-api-key
          value: "free-tier"

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

imagePullSecrets: []
