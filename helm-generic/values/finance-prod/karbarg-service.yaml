environment: prod

replicaCount: 2
appName: "karbarg-back-prod"

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/finance/karbarg/karbarg-spring/karbarg-service
  pullPolicy: IfNotPresent
  tag: v1.2.12-prod

secrets:
  enabled: true
  refs:
    - karbarg-back-prod

storage:

  nfs:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/karbarg/karbarg/back"
    mountPath: /u01/log

  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/karbarg/karbarg/shelllog" 

  nfs_apm:
    enabled: true
    path: /data/k8s-nfs/elastic-apm
    mountPath: /opt/apm-agent

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  hostPath:
    enabled: false
    path: /***
    mountPath: /***
    type: DirectoryOrCreate   

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  
  
  fourth_nfs:
    enabled: true
    server: "172.16.5.139"
    path: /data/k8s-nfs/prometheus
    mountPath: /opt/prometheus 

jmxExporter:
  port: 9010

serviceMonitor:
  interval: "15s"
  scrapeTimeout: "10s"
  path: "/metrics" 

configmap:

  CATALINA_OPTS: >-
    -Xms2g
    -Xmx4g
    -XX:MaxMetaspaceSize=512m
    -XX:+UseG1GC
    -XX:+UseContainerSupport
    -Djava.awt.headless=true
    -Djdk.tls.ephemeralDHKeySize=2048
    -Dorg.apache.catalina.security.SecurityListener.UMASK=0027
    --add-opens=java.base/java.lang=ALL-UNNAMED
    --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens=java.base/java.io=ALL-UNNAMED
    --add-opens=java.base/java.util=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED
    --enable-native-access=ALL-UNNAMED

  ELASTIC_APM_VERIFY_SERVER_CERT: false
  ELASTIC_APM_SERVER_URL: "http://apm-devops.tamin.ir:8201"
  ELASTIC_APM_SERVICE_NAME: "karbarg-back-prod"
  ELASTIC_APM_ENVIRONMENT: "Finance-prod"
  ELASTIC_APM_LOG_LEVEL: "INFO" 
  ELASTIC_APM_APPLICATION_PACKAGES: "org.tamin,ir.tamin"
  ELASTIC_APM_CAPTURE_BODY: "all"
  ELASTIC_APM_CAPTURE_HEADERS: "true"
  ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "0.01" 
  ELASTIC_APM_SPAN_FRAMES_MIN_DURATION: "10ms" 
  ELASTIC_APM_STACK_TRACE_LIMIT: "50"

  JAVA_TOOL_OPTIONS: >-
    -javaagent:/opt/apm-agent/elastic-apm-agent.jar
    -javaagent:/opt/prometheus/jmx_prometheus_javaagent-1.6.0.jar=9010:/opt/prometheus/jmx-exporter.yaml

  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8082"
  MANAGEMENT_PORT: "8010"
  MANAGEMENT_ENDPOINTS: "health,info,metrics,threaddump"
  ALLOWED_UPLOAD_COUNT: "50"

  HIKARI_POOL_NAME: "journal-hikari-pool"
  HIKARI_MAX_POOL_SIZE: "20"
  HIKARI_MIN_IDLE: "4"
  HIKARI_CONNECTION_TIMEOUT: "30000"
  HIKARI_IDLE_TIMEOUT: "600000"
  HIKARI_MAX_LIFETIME: "1800000"

  JPA_DDL_AUTO: "none"
  HIBERNATE_BATCH_SIZE: "500"
  HIBERNATE_ORDER_INSERTS: "true"
  HIBERNATE_ORDER_UPDATES: "true"
  JPA_SHOW_SQL: "true"

  BATCH_ISOLATION_LEVEL: "default"
  BATCH_INIT_SCHEMA: "never"
  BATCH_JOB_ENABLED: "false"

  SESSION_INIT_SCHEMA: "always"
  ELASTICSEARCH_REPOS_ENABLED: "true"

  KAFKA_SERVER: "172.16.5.146:9092,172.16.5.147:9092,172.16.5.148:9092"
  KAFKA_CONSUMER_GROUP_ID: "karbarg-consumer-group"
  KAFKA_AUTO_OFFSET_RESET: "latest"
  KAFKA_ISOLATION_LEVEL: "read_committed"
  KAFKA_PRODUCER_ACKS: "all"
  KAFKA_DELIVERY_TIMEOUT: "120000"
  KAFKA_IDEMPOTENCE: "true"
  KAFKA_LINGER_MS: "0"
  KAFKA_MAX_IN_FLIGHT: "5"
  KAFKA_CONSUMER_ENABLED: "true"
  KARBARG_CONSUMER_GROUP: "karbarg-prod-group"
  KARBARG_KAFKA_TOPICS_PARTITIONS: "3"
  KARBARG_KAFKA_TOPICS_REPLICAS: "3"
  KAFKA_TOPIC_PREFIX: "" 

  API_GET_SUPERVISOR: "karbarg-back-supervisor-prod:8080/api/"      
  ELASTICSEARCH_URIS: "http://172.16.5.163:9200,http://172.16.5.164:9200,http://172.16.5.165:9200"
  ELASTIC_USERNAME: "karbarg"
  ELASTIC_PASSWORD:  "jsdfnlske214654dmfvb"
  ELASTICSEARCH_CONNECTION_TIMEOUT: "10s"
  ELASTICSEARCH_SOCKET_TIMEOUT: "60s"

  EUREKA_REGISTER: "true"
  EUREKA_FETCH_REGISTRY: "true"
  EUREKA_DEFAULT_ZONE: "http://localhost:8761/eureka/"
  EUREKA_PREFER_IP: "true"

  LOG_LEVEL_SECURITY: "INFO"
  LOG_LEVEL_WEB: "DEBUG"
  LOG_LEVEL_JDBC: "DEBUG"
  LOG_LEVEL_JDBC_TRACE: "TRACE"

  TAMIN_APP_ID: karbarg
  TAMIN_USER_BASE_URL: "https://me.tamin.ir/api/v2.0/users/{nationalCode}"
  TAMIN_SECURITY_VERSION: "v2"

  OAUTH_JWKS_URI: "https://account.tamin.ir/auth/.well-known/jwks.json"
  OAUTH_AUDIENCE_URI: "http://karbarg-back-api-gw-prod:8080"  
  OAUTH_CLIENT_ID: "112f0d1d383036032a29500c6f2e1503"
  OAUTH_CLIENT_SECRET: "47078c804c47371d5a2d4d2571002d7469235e2315690b317183631e6d3d8258"
  OAUTH_TOKEN_ENDPOINT: "https://account.tamin.ir/auth/server/token"
  OAUTH_AUTH_ENDPOINT: "https://account.tamin.ir/auth/server/authorize"

  APP_ID: "karbarg"

  JDBC_FETCH_SIZE: "100"

  INSPECTOR_ALLOWED_COUNT: "1"
  INSPECTOR_ALLOWED_COUNT_IN_SUPERVISION: "1"
  INSPECTOR_ALLOWED_DAY: "10"

  API_REGISTRATION_INQUIRY: "https://soa.tamin.ir/ws/api/personal/{nationalId}/{birthDate}/{clientId}"
  API_KARPAZIRAN_USER_NATIONALID: "http://karpaziran-back-prod:8080/api/Contractor/GetContractorNationalIdByManagerNationalCode/{nationalCode}"
  API_KARPAZIRAN_USER_ROLE: "http://karpaziran-back-prod:8080/api/Contractor/GetRoleByNationalCode/{nationalCode}"
  API_INSURED_EMPLOYEE_AVERAGE: "https://workshop.tamin.ir/api/out-sourcing-workshops-services/get-info-payment/{legal}/{workshopId}/{branchCode}/{year}/{month}"
  API_EXECUTOR_GET_LIST: "http://karpaziran-back-prod:8080/api/Contractor/GetAllContractorProjectService"
  API_SHAHKAR_INQUIRY: "https://soa.tamin.ir/ws/api/shahkar/v.1/mobile-identity-main?nationalCode={nationalCode}&mobileNumber={mobile}"
  API_EMPLOYER_WORKSHOPS: "https://workshop.tamin.ir/api/erequest-workshops-services/employer/get-all-workshops/{nationalCode}"
  API_CONTRACTORS_BASE: "http://karpaziran-back-prod:8080/api"
  API_MAFASA_BASE: "https://workshop.tamin.ir/api/out-sourcing-workshops-services/get-mafasa/{workshopCode}/{branchCode}/{contractRow}"
  API_CONTRACT_BASE: "https://workshop.tamin.ir/api/out-sourcing-workshops-services/get-contract-list/{workshopCode}/{branchCode}/{fromDate}/{toDate}"
  API_CONTRACT_WORKSHOP_CHARACTER: "https://workshop.tamin.ir/api/workshops-services/workshop-v2/{workshopCode}/{branchCode}"
  API_GET_CONTRACTOR_INFOS: "http://karpaziran-back-prod:8080/api/Contractor/GetAllRoleByNationalCode/{nationalId}"
  API_GET_SCORE: "http://karbarg-back-supervisor-prod:8080/api/"
  API_INSURANCE_HEADER: "https://workshop.tamin.ir/api/out-sourcing-workshops-services/get-info-list-header/{workshopCode}/{branchCode}/{fromDate}/{toDate}"
  API_INSURANCE_DETAIL: "https://workshop.tamin.ir/api/out-sourcing-workshops-services/get-info-list-detail/{workshopCode}/{branchCode}/{fromDate}/{toDate}"
  API_CAMUNDA_TASKS: ""
  API_CAMUNDA_BASE: ""
  GET_HISTORY_BY_JOB: "https://individual.tamin.ir/api/monthRecords"
  API_GET_QC: "http://karbarg-back-qc-prod:8080/api/"
  API_GET_SDS: "http://sds-api-back-prod:8080/api"

service:
  enabled: true
  ports:
    - name: http
      port: 8080
      targetPort: 8082

service2:
  enabled: false
  type: ClusterIP
  ports: []


resources:
  limits:
    cpu: 3000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 500Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80


httpRoute:
  enabled: true
  hostnames:
    - "karbarg-service.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /

rateLimitPolicy:
  enabled: true  
  
  rules:
    - requests: 10000       
      unit: Minute      
      useXForwardedFor: false     
  pathRules: []

httpRoute2:
  enabled: false
  hostnames:
    - "admin.bankoperation.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8081
      matches:
        - path:
            type: PathPrefix
            value: /admin
 
rateLimitPolicy2:
  enabled: false
  rules:
    - requests: 500
      unit: Minute
  pathRules: []

timeout:
  requestTimeout: "120s"

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

imagePullSecrets: []

serviceAccount:
  create: false
  annotations: {}
  name: ""
