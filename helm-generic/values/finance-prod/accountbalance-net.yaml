environment: prod

replicaCount: 2
appName: accountbalance-back-prod
appsettings_enabled: true  

secrets:
  enabled: true
  refs:
    - accountbalance-back-prod

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/finance/accountbalance/accountbalance-net
  pullPolicy: IfNotPresent
  tag: v1.1.1-prod

serviceAccount:
  create: false
  annotations: {}
  name: ""
service:
  enabled: true
  ports:
    - name: http
      port: 8080
      targetPort: 8080

service2:
  enabled: false
  type: ClusterIP
  ports: []

storage:

  nfs:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/accountbalance/back"
    mountPath: /app/logs

  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/accountbalance/back/shelllog"

  hostPath:
    enabled: false
    path: /***
    mountPath: /***
    type: DirectoryOrCreate   

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  nfs_apm:
    enabled: true
    server: "172.16.5.139"
    path: "/data/k8s-nfs/elastic-apm"
    mountPath: /opt/apm-agent   

  fourth_nfs:
    enabled: true
    server: "172.16.5.139"
    path: /data/k8s-nfs/prometheus
    mountPath: /opt/prometheus 

jmxExporter:
  port: 9010

serviceMonitor:
  interval: "15s"
  scrapeTimeout: "10s"
  path: "/metrics"           

configmap:

  ELASTIC_APM_VERIFY_SERVER_CERT: false
  ELASTIC_APM_SERVER_URL: "http://apm-devops.tamin.ir:8201"
  ELASTIC_APM_SERVICE_NAME: "accountbalance-back-prod"
  ELASTIC_APM_ENVIRONMENT: "Finance-prod"
  ELASTIC_APM_LOG_LEVEL: "INFO" 
  ELASTIC_APM_APPLICATION_PACKAGES: "org.tamin,ir.tamin"
  ELASTIC_APM_CAPTURE_BODY: "all"
  ELASTIC_APM_CAPTURE_HEADERS: "true"
  ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "0.01" 
  ELASTIC_APM_SPAN_FRAMES_MIN_DURATION: "10ms" 
  ELASTIC_APM_STACK_TRACE_LIMIT: "50"

  JAVA_TOOL_OPTIONS: >-
    -javaagent:/opt/apm-agent/elastic-apm-agent.jar
    -javaagent:/opt/prometheus/jmx_prometheus_javaagent-1.6.0.jar=9010:/opt/prometheus/jmx-exporter.yaml  

  #Cors__AllowedOrigins: 'https://me.tamin.ir;https://accountbalance.tamin.ir;https://account.tamin.ir;https://accountbalance.tamin.ir/api;https://account.tamin.ir/auth/server/token;'
  ASPNETCORE_ENVIRONMENT: 'Production'
  TZ: "Asia/Tehran"

resources:
  limits:
    cpu: 2000m
    memory: 6Gi
  requests:
    cpu: 250m
    memory: 3500Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

httpRoute:
  enabled: true
  hostnames:
    - "accountbalance.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /api

rateLimitPolicy:
  enabled: true  
  
  rules:
    - requests: 1000       
      unit: Minute      
      useXForwardedFor: false     
  pathRules: []

httpRoute2:
  enabled: false
  hostnames:
    - "admin.accountbalance.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /admin
 
rateLimitPolicy2:
  enabled: false
  rules:
    - requests: 500
      unit: Minute
  pathRules: []

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations:
  instrumentation.opentelemetry.io/inject-dotnet: "true"

podSecurityContext: {}

securityContext: {}

imagePullSecrets: []

