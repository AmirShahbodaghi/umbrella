environment: prod

replicaCount: 8
appName: sds-file-back-prod
appsettings_enabled: false  

secrets:
  enabled: true
  refs:
    - sds-file-back-prod

image:
  registry: pull-devops.tamin.ir
  repository: ir.tamin/finance/office-inspection-sds-file-processor-spring
  pullPolicy: IfNotPresent
  tag: v2.0.7-prod

serviceAccount:
  create: false
  annotations: {}
  name: ""

service:
  enabled: true
  ports:
    - name: http
      port: 8080
      targetPort: 8080

service2:
  enabled: false
  type: ClusterIP
  ports: []

storage:

  nfs:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/sds/back/file"
    mountPath: /u01/log

  nfs_shell_log:
    enabled: true
    server: "172.16.5.139"
    path: "finance-prod/sds/back/file/shelllog"

  hostPath:
    enabled: false
    path: /***
    mountPath: /***
    type: DirectoryOrCreate   

  pvc:
    enabled: false
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 10Gi

  nfs_apm:
    enabled: true
    server: "172.16.5.139"
    path: "/data/k8s-nfs/elastic-apm"
    mountPath: /opt/apm-agent      

  second_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"

  third_nfs:
    enabled: false
    server: "172.16.5.139"
    path: "***"
    mountPath: "***"  
  
  fourth_nfs:
    enabled: true
    server: "172.16.5.139"
    path: /data/k8s-nfs/prometheus
    mountPath: /opt/prometheus 

jmxExporter:
  port: 9010

serviceMonitor:
  interval: "15s"
  scrapeTimeout: "10s"
  path: "/metrics"       

configmap:

  CATALINA_OPTS: >-
    -Xms1g
    -Xmx15g
    -XX:MaxMetaspaceSize=512m
    -XX:+UseG1GC
    -XX:+UseContainerSupport
    -Djava.awt.headless=true
    -Djdk.tls.ephemeralDHKeySize=2048
    -Dorg.apache.catalina.security.SecurityListener.UMASK=0027
    --add-opens=java.base/java.lang=ALL-UNNAMED
    --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens=java.base/java.io=ALL-UNNAMED
    --add-opens=java.base/java.util=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED
    --enable-native-access=ALL-UNNAMED

  ELASTIC_APM_VERIFY_SERVER_CERT: false
  ELASTIC_APM_SERVER_URL: "http://apm-devops.tamin.ir:8201"
  ELASTIC_APM_SERVICE_NAME: "sds-file-back-prod"
  ELASTIC_APM_ENVIRONMENT: "Finance-prod"
  ELASTIC_APM_LOG_LEVEL: "INFO" 
  ELASTIC_APM_APPLICATION_PACKAGES: "org.tamin,ir.tamin"
  ELASTIC_APM_CAPTURE_BODY: "all"
  ELASTIC_APM_CAPTURE_HEADERS: "true"
  ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "0.01" 
  ELASTIC_APM_SPAN_FRAMES_MIN_DURATION: "10ms" 
  ELASTIC_APM_STACK_TRACE_LIMIT: "50"

  JAVA_TOOL_OPTIONS: >-
    -javaagent:/opt/apm-agent/elastic-apm-agent.jar
    -javaagent:/opt/prometheus/jmx_prometheus_javaagent-1.6.0.jar=9010:/opt/prometheus/jmx-exporter.yaml

  SPRING_PROFILES_ACTIVE: 'prod'
  KAFKA_SERVER: "172.16.5.146:9092,172.16.5.147:9092,172.16.5.148:9092"
  SDS_ORIGINS: "https://officesds.tamin.ir"
  KAFKA_FILE_ENABLED: "true"

resources: 
  requests:
    cpu: 1000m
    memory: 18Gi
  limits:
    cpu: 4000m
    memory: 24Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

httpRoute:
  enabled: false
  hostnames:
    - "officesds.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /api

rateLimitPolicy:
  enabled: true  
  
  rules:
    - requests: 1000       
      unit: Minute      
      useXForwardedFor: false     
  pathRules: []

httpRoute2:
  enabled: false
  hostnames:
    - "admin.officesds.tamin.ir"
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  rules:
    - port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /admin
 
rateLimitPolicy2:
  enabled: false
  rules:
    - requests: 500
      unit: Minute
  pathRules: []

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

imagePullSecrets: []
