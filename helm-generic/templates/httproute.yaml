{{- if and .Values.httpRoute .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- if .name }}
      name: {{ .name }}
      {{- end }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- if .filters }}
      filters:
        {{- range .filters }}
        - type: {{ .type }}
          {{- if eq .type "URLRewrite" }}
          urlRewrite:
            {{- if .hostname }}
            hostname: {{ .hostname }}
            {{- end }}
            {{- if .path }}
            path:
              type: {{ .path.type | default "ReplaceFullPath" }}
              {{- if eq (.path.type | default "ReplaceFullPath") "ReplaceFullPath" }}
              replaceFullPath: {{ .path.value }}
              {{- else if eq .path.type "ReplacePrefixMatch" }}
              replacePrefixMatch: {{ .path.value }}
              {{- end }}
            {{- end }}
          {{- else if eq .type "RequestRedirect" }}
          requestRedirect:
            {{- if .hostname }}
            hostname: {{ .hostname }}
            {{- end }}
            {{- if .path }}
            path:
              type: {{ .path.type | default "ReplaceFullPath" }}
              {{- if eq (.path.type | default "ReplaceFullPath") "ReplaceFullPath" }}
              replaceFullPath: {{ .path.value }}
              {{- else if eq .path.type "ReplacePrefixMatch" }}
              replacePrefixMatch: {{ .path.value }}
              {{- end }}
            {{- end }}
            {{- if .statusCode }}
            statusCode: {{ .statusCode }}
            {{- end }}
            {{- if .scheme }}
            scheme: {{ .scheme }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- $hasRedirect := false }}
      {{- range .filters }}
        {{- if eq .type "RequestRedirect" }}
          {{- $hasRedirect = true }}
        {{- end }}
      {{- end }}
      {{- if not $hasRedirect }}
      backendRefs:
        {{- if $.Values.serviceName }}
        - name: {{ include "generic-app.serviceName" $ }}
        {{- else }}
        - name: {{ include "generic-app.fullname" $ }}
        {{- end }}
          port: {{ .port | default 8080 }}
      {{- end }}
    {{- end }}
{{- end }}

