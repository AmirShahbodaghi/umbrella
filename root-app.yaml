apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default   
 
  source:
    repoURL: https://gitlab.ir/devops/cd/umbrella/argocd-apps.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: "appsets/*.yaml"   
 
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

